<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-label="The Dragon Palace beneath the sea, its doorway shining, flanked by its two treasures: a heap of jewels, and a chest of scriptures with scrolls upon it">
<style>
  .ln { fill:none; stroke:#d9b25f; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .ln-bright { fill:none; stroke:#f4dc96; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .ln-thin { fill:none; stroke:#d9b25f; stroke-width:1.3; stroke-linecap:round;
              stroke-linejoin:round; opacity:.8; }
  .ln-faint { fill:none; stroke:#8d7440; stroke-width:1; opacity:.6; }
  .skin { fill:url(#skin); stroke:#f4dc96; stroke-width:2.1; stroke-linejoin:round;
           stroke-linecap:round; }
  .gild { fill:url(#gild); stroke:#f4dc96; stroke-width:1.8; stroke-linejoin:round; }
  .label { font-family:"Cormorant Garamond",Georgia,serif; fill:#c9bfa6; font-size:15px; }
  .label-zh { font-family:"LXGW WenKai TC","Kaiti TC",serif; fill:#d9b25f; font-size:20px;
               letter-spacing:.1em; }
</style>
<defs>
  <!-- barely above the page ground, so the hands read as line-art while still
       being opaque enough to occlude the fingers passing beneath them -->
  <linearGradient id="skin" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0%" stop-color="#122340"/><stop offset="100%" stop-color="#0b1729"/>
  </linearGradient>
  <linearGradient id="vaseBody" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1d3560"/><stop offset="60%" stop-color="#132443"/>
    <stop offset="100%" stop-color="#0d1930"/>
  </linearGradient>
  <linearGradient id="gild" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#d9b25f" stop-opacity=".30"/>
    <stop offset="55%" stop-color="#d9b25f" stop-opacity=".14"/>
    <stop offset="100%" stop-color="#d9b25f" stop-opacity=".26"/>
  </linearGradient>
  <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f4dc96"/><stop offset="100%" stop-color="#a8814a"/>
  </linearGradient>
</defs>

