<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 440" role="img" aria-label="The Sixteenth Karmapa, in his brocade ceremonial crown, hand raised in mudra — the naga of the spring restored beside him, clouds gathering and the first rain beginning to fall">
<style>
  .ln { fill:none; stroke:#d9b25f; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .ln-bright { fill:none; stroke:#f4dc96; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .ln-thin { fill:none; stroke:#d9b25f; stroke-width:1.3; stroke-linecap:round;
              stroke-linejoin:round; opacity:.8; }
  .ln-faint { fill:none; stroke:#8d7440; stroke-width:1; opacity:.6; }
  .skin { fill:url(#skin); stroke:#f4dc96; stroke-width:2.1; stroke-linejoin:round;
           stroke-linecap:round; }
  .gild { fill:url(#gild); stroke:#f4dc96; stroke-width:1.8; stroke-linejoin:round; }
  .label { font-family:"Cormorant Garamond",Georgia,serif; fill:#c9bfa6; font-size:15px; }
  .label-zh { font-family:"LXGW WenKai TC","Kaiti TC",serif; fill:#d9b25f; font-size:20px;
               letter-spacing:.1em; }

  .body-fill { fill:url(#naBodyGrad); stroke:#d9b25f; stroke-width:1.6; stroke-linejoin:round; }
  .spike { fill:url(#naSpikeGrad); stroke:#d9b25f; stroke-width:.7; }
  .plate { fill:none; stroke:#d9b25f; stroke-width:.9; opacity:.7; }
  .mane { fill:url(#naManeGrad); stroke:#d9b25f; stroke-width:1; }
  .mane2 { opacity:.75; }
  .horn { fill:#0c1830; stroke:#f4dc96; stroke-width:1.3; stroke-linejoin:round; }
  .horn2 { opacity:.6; }
  .skull { fill:url(#naHeadGrad); stroke:#f4dc96; stroke-width:1.7; stroke-linejoin:round; }
  .line { fill:none; stroke:#f4dc96; stroke-width:1.2; stroke-linecap:round; }
  .tooth { fill:#f4dc96; }
  .tongue { fill:#8d5a3a; opacity:.9; }
  .eye-white { fill:#f7ecd2; stroke:#d9b25f; stroke-width:.8; }
  .eye-iris { fill:#f4dc96; }
  .eye-pupil { fill:#2a1c08; }
  .eye-glint { fill:#fff; }
  .whisker { fill:none; stroke:#f4dc96; stroke-width:1.3; stroke-linecap:round; }
</style>
<defs>
  <!-- barely above the page ground, so the hands read as line-art while still
       being opaque enough to occlude the fingers passing beneath them -->
  <linearGradient id="skin" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0%" stop-color="#122340"/><stop offset="100%" stop-color="#0b1729"/>
  </linearGradient>
  <linearGradient id="vaseBody" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1d3560"/><stop offset="60%" stop-color="#132443"/>
    <stop offset="100%" stop-color="#0d1930"/>
  </linearGradient>
  <linearGradient id="gild" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#d9b25f" stop-opacity=".30"/>
    <stop offset="55%" stop-color="#d9b25f" stop-opacity=".14"/>
    <stop offset="100%" stop-color="#d9b25f" stop-opacity=".26"/>
  </linearGradient>
  <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f4dc96"/><stop offset="100%" stop-color="#a8814a"/>
  </linearGradient>
</defs>

<defs>
  <linearGradient id="naBodyGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1a2f56"/><stop offset="55%" stop-color="#101f39"/>
    <stop offset="100%" stop-color="#0c1830"/>
  </linearGradient>
  <linearGradient id="naHeadGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2a4470"/><stop offset="100%" stop-color="#16294a"/>
  </linearGradient>
  <linearGradient id="naManeGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#d9b25f" stop-opacity=".85"/>
    <stop offset="100%" stop-color="#8d7440" stop-opacity=".3"/>
  </linearGradient>
  <linearGradient id="naSpikeGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f4dc96" stop-opacity=".8"/>
    <stop offset="100%" stop-color="#8d7440" stop-opacity=".35"/>
  </linearGradient>
</defs>
