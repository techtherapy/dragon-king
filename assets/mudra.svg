<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="The mudra of the Dragon King Yoga: the index and middle fingers of both hands crossed to form the lattice of the character 井">
<style>
  .ln { fill:none; stroke:#d9b25f; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .ln-bright { fill:none; stroke:#f4dc96; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .ln-thin { fill:none; stroke:#d9b25f; stroke-width:1.2; stroke-linecap:round; opacity:.75; }
  .ln-faint { fill:none; stroke:#8d7440; stroke-width:1; opacity:.55; }
  .fill-ink { fill:url(#skin); stroke:#f4dc96; stroke-width:2; stroke-linejoin:round; }
  .label { font-family:"Cormorant Garamond",Georgia,serif; fill:#c9bfa6; font-size:15px; }
  .label-zh { font-family:"LXGW WenKai TC","Kaiti TC",serif; fill:#d9b25f; font-size:16px; letter-spacing:.12em; }
  .cap { font-family:"Cormorant Garamond",Georgia,serif; fill:#d9b25f; font-size:14px;
          letter-spacing:.28em; text-transform:uppercase; }
</style>
<defs>
  <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1c3358"/><stop offset="100%" stop-color="#101f39"/>
  </linearGradient>
  <linearGradient id="vaseBody" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1d3560"/><stop offset="60%" stop-color="#132443"/>
    <stop offset="100%" stop-color="#0d1930"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0%" stop-color="#f4dc96" stop-opacity=".34"/>
    <stop offset="60%" stop-color="#d9b25f" stop-opacity=".10"/>
    <stop offset="100%" stop-color="#d9b25f" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f4dc96"/><stop offset="100%" stop-color="#a8814a"/>
  </linearGradient>
</defs>

<circle cx="290" cy="208" r="188" fill="url(#glow)"/>

<!-- the character the hands imitate -->
<g opacity=".11">
  <path class="ln" stroke-width="11" d="M236 90 L216 330 M340 90 L320 330 M118 176 L470 150 M118 252 L470 226"/>
</g>

<!-- LEFT HAND: wrist in from the edge, palm, two fingers laid across -->
<g>
  <path class="fill-ink" d="M18 196 L96 190 C118 188 132 202 132 224 L132 264
       C132 286 118 300 96 298 L18 292 C10 291 6 286 6 278 L6 210 C6 202 10 197 18 196 Z"/>
  <path class="ln-thin" d="M40 196 L40 292 M64 236 C84 230 106 230 124 236"/>
</g>

<!-- RIGHT HAND: wrist up from below, palm, two fingers rising -->
<g>
  <path class="fill-ink" d="M292 424 L292 350 C292 328 306 314 328 314 L368 314
       C390 314 404 328 402 350 L402 424 C402 428 398 430 392 430 L302 430
       C296 430 292 428 292 424 Z"/>
  <path class="ln-thin" d="M292 400 L402 400 M334 352 C328 372 328 392 334 408"/>
</g>

  <path class="fill-ink" d="M319.7 315.0 L274.3 93.7 Q259.3 81.9 249.7 98.3 L288.3 321.0 Z"/>
  <path class="ln-thin" d="M300.7 240.4 Q288.4 235.6 278.7 244.6"/>
