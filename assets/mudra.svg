  <path class="fill-ink" d="M371.8 315.3 L330.3 93.9 Q315.6 81.8 305.7 98.1 L340.2 320.7 Z"/>
  <path class="ln-thin" d="M354.1 240.6 Q341.9 235.6 332.0 244.4"/>
  <path class="ln-thin" d="M341.2 169.7 Q329.8 165.1 320.7 173.2"/>
  <path class="ln-thin" d="M329.3 113.1 Q318.3 97.8 313.0 115.9"/>
  <path class="fill-ink" d="M151.8 229.9 L459.4 192.4 Q472.3 178.4 456.6 167.6 L148.2 198.1 Z"/>
  <path class="ln-thin" d="M255.9 213.6 Q261.7 201.7 253.5 191.3"/>
  <path class="ln-thin" d="M354.4 201.9 Q359.7 190.8 352.1 181.2"/>
  <path class="ln-thin" d="M440.3 190.3 Q456.1 180.2 438.5 173.9"/>
  <path class="fill-ink" d="M151.7 283.9 L459.3 248.4 Q472.3 234.5 456.7 223.6 L148.3 252.1 Z"/>
  <path class="ln-thin" d="M255.9 268.3 Q261.7 256.4 253.6 246.0"/>
  <path class="ln-thin" d="M354.4 257.2 Q359.7 246.2 352.2 236.5"/>
  <path class="ln-thin" d="M440.2 246.1 Q456.1 236.2 438.5 229.7"/>

<!-- where the four fingers cross -->
<circle cx="245" cy="197" r="5" fill="#f4dc96"/>
<circle cx="301" cy="191" r="5" fill="#f4dc96"/>
<circle cx="254" cy="253" r="5" fill="#f4dc96"/>
<circle cx="310" cy="247" r="5" fill="#f4dc96"/>

<text class="label-zh" x="506" y="118" font-size="44" text-anchor="middle">井</text>
<text class="label" x="506" y="142" text-anchor="middle" font-size="13">jǐng</text>

</svg>
