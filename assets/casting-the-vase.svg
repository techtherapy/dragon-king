<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" role="img" aria-label="The empowered treasure vase, tied with five coloured cloths, arcing through the air into the waves of the sea">
<style>
  .ln { fill:none; stroke:#d9b25f; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .ln-bright { fill:none; stroke:#f4dc96; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .ln-thin { fill:none; stroke:#d9b25f; stroke-width:1.2; stroke-linecap:round; opacity:.75; }
  .ln-faint { fill:none; stroke:#8d7440; stroke-width:1; opacity:.55; }
  .fill-ink { fill:url(#skin); stroke:#f4dc96; stroke-width:2; stroke-linejoin:round; }
  .label { font-family:"Cormorant Garamond",Georgia,serif; fill:#c9bfa6; font-size:15px; }
  .label-zh { font-family:"LXGW WenKai TC","Kaiti TC",serif; fill:#d9b25f; font-size:16px; letter-spacing:.12em; }
  .cap { font-family:"Cormorant Garamond",Georgia,serif; fill:#d9b25f; font-size:14px;
          letter-spacing:.28em; text-transform:uppercase; }
</style>
<defs>
  <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1c3358"/><stop offset="100%" stop-color="#101f39"/>
  </linearGradient>
  <linearGradient id="vaseBody" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1d3560"/><stop offset="60%" stop-color="#132443"/>
    <stop offset="100%" stop-color="#0d1930"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0%" stop-color="#f4dc96" stop-opacity=".34"/>
    <stop offset="60%" stop-color="#d9b25f" stop-opacity=".10"/>
    <stop offset="100%" stop-color="#d9b25f" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f4dc96"/><stop offset="100%" stop-color="#a8814a"/>
  </linearGradient>
</defs>

<circle cx="300" cy="180" r="210" fill="url(#glow)"/>

<!-- flight path -->
<path class="ln-faint" stroke-dasharray="5 9" d="M112 236 C210 96 400 84 520 210"/>

<!-- the vase, mid-flight -->
<g transform="translate(300 104) rotate(24)">
  <path d="M-13 -26 L-13 -34 C-13 -37 13 -37 13 -34 L13 -26 C13 -22 18 -20 18 -16 C30 -8 36 8 36 24 C36 44 22 56 0 56 C-22 56 -36 44 -36 24 C-36 8 -30 -8 -18 -16 C-18 -20 -13 -22 -13 -26 Z" fill="url(#vaseBody)" stroke="#f4dc96" stroke-width="2"/>
  <g transform="translate(0 -30)"><g transform="rotate(-34)"><path d="M-4 -34 C-7 -20 -5 -6 2 4 C7 -6 6 -20 4 -34 Z" fill="#b8452f" opacity=".85"/></g><g transform="rotate(-17)"><path d="M-4 -34 C-7 -20 -5 -6 2 4 C7 -6 6 -20 4 -34 Z" fill="#5b8c5a" opacity=".85"/></g><g transform="rotate(0)"><path d="M-4 -34 C-7 -20 -5 -6 2 4 C7 -6 6 -20 4 -34 Z" fill="#4a6fa5" opacity=".85"/></g><g transform="rotate(17)"><path d="M-4 -34 C-7 -20 -5 -6 2 4 C7 -6 6 -20 4 -34 Z" fill="#e8e0cc" opacity=".85"/></g><g transform="rotate(34)"><path d="M-4 -34 C-7 -20 -5 -6 2 4 C7 -6 6 -20 4 -34 Z" fill="#d9b25f" opacity=".85"/></g></g>
  <ellipse cx="0" cy="-34" rx="14" ry="4.5" fill="url(#coin)" stroke="#f4dc96" stroke-width="1"/>
</g>

<!-- sparks trailing -->
<circle cx="196" cy="150" r="2.6" fill="#f4dc96" opacity=".8"/>
